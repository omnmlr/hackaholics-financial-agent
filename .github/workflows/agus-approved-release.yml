name: AGUS integrated approved release (fictional data)
on:
  pull_request:
    branches: [release/agus-railway-ready-20261020, ui/agus-premium-experience-20261020]
permissions:
  contents: read
concurrency:
  group: agus-approved-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrated:
    name: Node ${{ matrix.node }} integrated application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.16.0", "24"]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PREMIUM_SCREENSHOTS: docs/intelligence-motion/screenshots
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Select Chromium
        run: node --input-type=module -e 'import {chromium} from "playwright"; import {appendFileSync} from "node:fs"; appendFileSync(process.env.GITHUB_ENV, "CHROMIUM_PATH=" + chromium.executablePath() + String.fromCharCode(10))'
      - run: npm run test:http
      - run: npm run test:browser
      - run: npm run test:browser:native
      - run: npm run test:browser:premium
      - run: npm run test:browser:motion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agus-integrated-node-${{ matrix.node }}
          path: |
            docs/intelligence-motion/screenshots/
            /tmp/agus-native-agent-browser.json
            /tmp/agus-native-agent-*.png
            /tmp/agus-chat-payments-browser.json
            /tmp/agus-chat-payments-*.png
            /tmp/agus-voice-submit.json
            /tmp/agus-voice-meter/results.json
          retention-days: 30
