name: AGUS financial workflows (fictional only)
on:
  pull_request:
    branches: [improve/agus-intelligence-motion-20261021]
permissions:
  contents: read
concurrency:
  group: agus-financial-workflows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrated:
    name: Node ${{ matrix.node }} financial workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.16.0", "24"]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Select Chromium
        run: node --input-type=module -e 'import {chromium} from "playwright"; import {appendFileSync} from "node:fs"; appendFileSync(process.env.GITHUB_ENV, "CHROMIUM_PATH=" + chromium.executablePath() + String.fromCharCode(10))'
      - run: npm run test:http
      - run: npm run test:browser
      - run: npm run test:browser:native
      - run: npm run test:browser:premium
        env:
          PREMIUM_SCREENSHOTS: /tmp/agus-ci-premium
      - run: npm run test:browser:motion
        env:
          PREMIUM_SCREENSHOTS: /tmp/agus-ci-motion
          CAPTURE_MOTION_VIDEO: "1"
      - run: npm run test:browser:workflows
        env:
          WORKFLOW_PHASE: outcomes
          MOBILE_VIEWPORT_CHECKS: "1"
          WORKFLOW_WIDTHS: 1440,1920,1280,820,390,320
          WORKFLOW_SCREENSHOTS: /tmp/agus-ci-workflows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agus-financial-workflows-node-${{ matrix.node }}
          path: |
            /tmp/agus-ci-premium/
            /tmp/agus-ci-motion/
            /tmp/agus-ci-workflows/
            /tmp/agus-native-agent-browser.json
            /tmp/agus-native-agent-*.png
            /tmp/agus-chat-payments-browser.json
            /tmp/agus-chat-payments-*.png
            /tmp/agus-voice-submit.json
            /tmp/agus-voice-meter/results.json
          retention-days: 30
