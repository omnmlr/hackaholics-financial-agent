name: AGUS final grounding review acceptance
on:
  push:
    branches: [improve/agus-intelligence-motion-20261021]
    paths:
      - scripts/verify-intelligence-review.ts
      - .github/workflows/agus-intelligence-review.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: agus-intelligence-review-20261021
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAYMENT_MODE: fixture
      FINANCIAL_DEMO_ENABLED: "true"
      LIVE_TRANSFERS_ENABLED: "false"
      PAYSTACK_TRANSFERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Guard one campaign before exposing the existing CI provider secret
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const prior = JSON.parse(readFileSync('docs/intelligence-motion/genuine-initial.json','utf8'));
          if (prior.commit !== 'a989ce40ff4f502388e07a37f822643bee130e85' || prior.attempts.length !== 21 || prior.attempts.some(a => a.status !== 200)) throw new Error('Prior attempt ledger does not match the reviewed campaign');
          const repair = JSON.parse(readFileSync('docs/intelligence-motion/genuine-repair.json','utf8'));
          if (repair.attempts.length !== 16 || repair.priorHttpAttempts !== 21) throw new Error('Repair ledger does not match');
          const final = JSON.parse(readFileSync('docs/intelligence-motion/genuine-final.json','utf8'));
          if (final.attempts !== 2 || final.priorHttpAttempts !== 37) throw new Error('Final diagnostic ledger does not match');
          const dates = JSON.parse(readFileSync('docs/intelligence-motion/genuine-dates.json','utf8'));
          if (dates.attempts !== 6 || dates.priorHttpAttempts !== 39) throw new Error('Source-date ledger does not match');
          const r = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/agus-intelligence-review.yml/runs?branch=improve%2Fagus-intelligence-motion-20261021&per_page=100`, {headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
          if (!r.ok) throw new Error('Cannot establish campaign ledger');
          const data = await r.json();
          if (Number(process.env.GITHUB_RUN_ATTEMPT) !== 1 || data.workflow_runs.some(run => String(run.id) !== process.env.GITHUB_RUN_ID && run.run_number < Number(process.env.GITHUB_RUN_NUMBER))) throw new Error('Campaign already started; no automatic repeat permitted');
          NODE
      - run: npm ci
      - name: At most 3 final HTTP attempts; 48 total including the previous 45
        env:
          AI_PROVIDER: gemini
          AI_MODEL: gemini-3.5-flash-lite
          AI_API_KEY: ${{ secrets.AGUS_GEMINI_API_KEY }}
          NODE_USE_ENV_PROXY: "1"
        run: node --import=tsx scripts/verify-intelligence-review.ts "${RUNNER_TEMP}/agus-intelligence-review.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agus-intelligence-review
          path: ${{ runner.temp }}/agus-intelligence-review.json
          retention-days: 30
