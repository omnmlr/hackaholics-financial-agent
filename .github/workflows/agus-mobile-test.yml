name: AGUS Mobile Test

on:
  push:
    branches: [pivot/solana-mobile-testing]
    paths:
      - ".github/workflows/agus-mobile-test.yml"
      - "packages/mobile-test/**"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Configure lab paths
        run: printf 'AGUS_LAB=%s/agus-mobile-test\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies and create the dedicated AVD
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$AGUS_LAB"
          sudo chmod 0666 /dev/kvm
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$ANDROID_HOME" && test -w "$ANDROID_HOME" || export ANDROID_HOME="$AGUS_LAB/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit 2>/dev/null || true)"
          if [[ -z "$sdkmanager" ]]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$AGUS_LAB/cmdline.zip"
            (cd "$AGUS_LAB" && printf 'e025545c62a8e64c7559119566a569fb1dec5f60  cmdline.zip\n' | sha1sum --check)
            unzip -q "$AGUS_LAB/cmdline.zip" -d "$AGUS_LAB/cmdline"
            mv "$AGUS_LAB/cmdline/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [[ ! -e "$ANDROID_HOME/licenses/android-sdk-license" ]]; then
            (yes || true) | "$sdkmanager" --licenses >/dev/null
          fi
          "$sdkmanager" "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;default;x86_64"
          export ANDROID_AVD_HOME="$AGUS_LAB/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\nANDROID_AVD_HOME=%s\n' \
            "$ANDROID_HOME" "$ANDROID_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          printf '%s/platform-tools\n' "$ANDROID_HOME" >> "$GITHUB_PATH"
          printf 'no\n' | "$(dirname "$sdkmanager")/avdmanager" create avd -n agus_ci \
            -p "$ANDROID_AVD_HOME/agus_ci.avd" -k 'system-images;android-35;default;x86_64' --force
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/agus_ci.avd" > "$ANDROID_AVD_HOME/agus_ci.ini"
          test -f "$ANDROID_AVD_HOME/agus_ci.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -x agus_ci
          npm ci --no-audit --no-fund
          npm test --workspace @agus/mobile-test
      - name: Build native fixture and download local Solana
        shell: bash
        run: |
          set -euxo pipefail
          bash packages/mobile-test/lab/build-android.sh "$AGUS_LAB"
          curl -fsSL 'https://github.com/solana-mobile/mobile-wallet-adapter/releases/download/%40solana-mobile/wallet-adapter-mobile%403.0.1/fakewallet-v1-debug.apk' -o "$AGUS_LAB/wallet.apk"
          curl -fsSL 'https://github.com/anza-xyz/agave/releases/download/v4.4.1/solana-release-x86_64-unknown-linux-gnu.tar.bz2' -o "$AGUS_LAB/agave.tar.bz2"
          (cd "$AGUS_LAB" && printf '5b0f0fc7e4eedace05f6455de00aa1f2f3d1642068f1e8d50760ba49112c3941  agave.tar.bz2\n' | sha256sum --check)
          tar -xjf "$AGUS_LAB/agave.tar.bz2" -C "$AGUS_LAB"
      - name: Execute Android wallet regression and reconcile payout
        shell: bash
        run: |
          set -euxo pipefail
          export AGUS_TEST_CONFIG="$AGUS_LAB/runner.json" AGUS_TEST_EVIDENCE="$AGUS_LAB/evidence"
          trap 'result=$?; if ((result)); then for log in emulator validator fixture; do tail -45 "$AGUS_LAB/$log.log" 2>/dev/null || true; done; adb -s emulator-5554 logcat -t 400 -v threadtime -s AGUS_TEST:I AGUS_FIXTURE:W || true; fi' EXIT
          "$ANDROID_HOME/emulator/emulator" -avd agus_ci -port 5554 -accel on -no-window -noaudio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$AGUS_LAB/emulator.log" 2>&1 &
          emulator_pid=$!
          "$AGUS_LAB/solana-release/bin/solana-test-validator" --ledger "$AGUS_LAB/ledger" --bind-address 127.0.0.1 \
            --rpc-port 8899 --faucet-per-request-sol-cap 1 --quiet > "$AGUS_LAB/validator.log" 2>&1 &
          rpc_genesis() {
            curl -fsS http://127.0.0.1:8899 -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getGenesisHash"}' | jq -er .result
          }
          for attempt in {1..45}; do
            if genesis="$(rpc_genesis)"; then break; fi
            sleep 2
          done
          export AGUS_TEST_LOCAL_GENESIS="${genesis:?Validator unavailable}"
          AGUS_TEST_LOCAL_GENESIS="$genesis" node --import tsx packages/mobile-test/lab/prepare.ts > "$AGUS_LAB/fixture.log" 2>&1 &
          for attempt in {1..90}; do
            kill -0 "$emulator_pid"
            if [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then break; fi
            sleep 2
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 reverse tcp:8898 tcp:8898
          adb -s emulator-5554 reverse tcp:8899 tcp:8899
          node --import tsx packages/mobile-test/lab/configure.ts "$AGUS_TEST_CONFIG" emulator-5554 \
            "$AGUS_LAB/agus-mwa-lab.apk" "$AGUS_LAB/wallet.apk"
          runner() { node --import tsx packages/mobile-test/src/cli.ts "$@"; }
          runner devices
          runner run wallet-transfer | tee "$AGUS_LAB/transfer.json"
          set +e
          runner run wallet-false-success > "$AGUS_LAB/negative.json"
          result=$?
          set -e
          test "$result" -eq 1
          jq -e '.state == "failed" and .failure.code == "FINALITY_TIMEOUT" and .callback.outcome == "submitted" and (.receipt == null)' "$AGUS_LAB/negative.json"
          negative_id="$(jq -er .runId "$AGUS_LAB/negative.json")"
          runner score "$negative_id" unresolved | jq -e '.correct == true'
          runner score "$negative_id" finalized | jq -e '.falseFinancialSuccess == true'
          runner run wallet-transfer | tee "$AGUS_LAB/rerun.json"
          run_id="$(jq -er .runId "$AGUS_LAB/rerun.json")"
          runner score "$run_id" finalized | jq -e '.correct == true and .taskCompleted == true'
          (umask 077 && openssl genpkey -algorithm ED25519 -out "$AGUS_LAB/runner-key.pem")
          openssl pkey -in "$AGUS_LAB/runner-key.pem" -pubout -out "$AGUS_LAB/runner.pub.pem"
          runner seal "$run_id" "$AGUS_LAB/runner-key.pem" > "$AGUS_LAB/sealed-report.json"
          runner verify-receipt "$AGUS_LAB/sealed-report.json" "$AGUS_LAB/runner.pub.pem" | jq -e '.valid == true'
          rm -f "$AGUS_LAB/runner-key.pem"
          node --import tsx packages/mobile-test/lab/settlement.ts "$AGUS_LAB/job" "$run_id"
          node --import tsx packages/mobile-test/lab/settlement.ts "$AGUS_LAB/job" "$run_id"
      - name: Upload disposable fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agus-mobile-test-evidence
          path: |
            ${{ env.AGUS_LAB }}/evidence
            ${{ env.AGUS_LAB }}/job/job.json
            ${{ env.AGUS_LAB }}/sealed-report.json
            ${{ env.AGUS_LAB }}/runner.pub.pem
            ${{ env.AGUS_LAB }}/emulator.log
          retention-days: 7
