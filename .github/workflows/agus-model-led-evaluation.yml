name: AGUS bounded architecture comparison (isolated)

on:
  push:
    branches: [experiment/agus-model-led-20261020]
    paths:
      - scripts/compare-agent-architectures.ts
      - .github/workflows/agus-model-led-evaluation.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: agus-architecture-campaign-20261020
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PAYMENT_MODE: fixture
      FINANCIAL_DEMO_ENABLED: "true"
      PAYSTACK_TRANSFERS_ENABLED: "false"
      LIVE_TRANSFERS_ENABLED: "false"
      LIVE_OWNER_AUTHORIZED: "false"
      LIVE_WEBHOOK_VALIDATED: "false"
      LIVE_RECONCILIATION_VALIDATED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Guard one automatic campaign; no secret or provider calls on rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/agus-model-led-evaluation.yml/runs?branch=experiment%2Fagus-model-led-20261020&per_page=100`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }
          });
          if (!response.ok) throw new Error('Cannot verify campaign spending history');
          const data = await response.json();
          if (Number(process.env.GITHUB_RUN_ATTEMPT) !== 1 || data.workflow_runs.some(run => String(run.id) !== process.env.GITHUB_RUN_ID && run.run_number < Number(process.env.GITHUB_RUN_NUMBER)))
            throw new Error('Automatic campaign already dispatched. Review its call ledger before authorizing a separately bounded repair run.');
          NODE
      - name: Install exact dependencies
        run: npm ci
      - name: Run shared-budget genuine Gemini comparison
        env:
          AI_PROVIDER: gemini
          AI_MODEL: gemini-3.5-flash-lite
          AI_API_KEY: ${{ secrets.AGUS_GEMINI_API_KEY }}
          AGUS_EVAL_MAX_CALLS: "220"
          AGUS_EVAL_ALREADY_SPENT: "0"
          NODE_USE_ENV_PROXY: "1"
        run: node --import=tsx scripts/compare-agent-architectures.ts "${RUNNER_TEMP}/agus-comparative-evaluation.json"
      - name: Save synthetic conversations, metrics, and exact commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agus-architecture-comparison
          path: ${{ runner.temp }}/agus-comparative-evaluation.json
          retention-days: 7
          if-no-files-found: warn
