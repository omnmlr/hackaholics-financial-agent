name: AGUS targeted native Gemini verification (fixture only)
on:
  push:
    branches: [hardening/agus-native-release-20261020]
    paths:
      - scripts/verify-native-gemini.ts
      - .github/workflows/agus-native-hardening-genuine.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: agus-targeted-native-campaign-20261020
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PAYMENT_MODE: fixture
      FINANCIAL_DEMO_ENABLED: "true"
      PAYSTACK_TRANSFERS_ENABLED: "false"
      LIVE_TRANSFERS_ENABLED: "false"
      LIVE_OWNER_AUTHORIZED: "false"
      LIVE_WEBHOOK_VALIDATED: "false"
      LIVE_RECONCILIATION_VALIDATED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Guard single campaign and reject reruns before exposing provider secret
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const r = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/agus-native-hardening-genuine.yml/runs?branch=hardening%2Fagus-native-release-20261020&per_page=100`, {headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
          if (!r.ok) throw new Error('Cannot establish campaign ledger');
          const data = await r.json();
          if (Number(process.env.GITHUB_RUN_ATTEMPT) !== 1 || data.workflow_runs.some(run => String(run.id) !== process.env.GITHUB_RUN_ID && run.run_number < Number(process.env.GITHUB_RUN_NUMBER))) throw new Error('Campaign already started: no automatic rerun permitted');
          NODE
      - run: npm ci
      - name: Native candidate only, <=40 actual generation attempts
        env:
          AI_PROVIDER: gemini
          AI_MODEL: gemini-3.5-flash-lite
          AI_API_KEY: ${{ secrets.AGUS_GEMINI_API_KEY }}
          NODE_USE_ENV_PROXY: "1"
        run: node --import=tsx scripts/verify-native-gemini.ts "${RUNNER_TEMP}/agus-native-genuine.json"
      - name: Preserve partial evidence even on quota failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agus-native-genuine
          path: ${{ runner.temp }}/agus-native-genuine.json
          retention-days: 30
          if-no-files-found: warn
