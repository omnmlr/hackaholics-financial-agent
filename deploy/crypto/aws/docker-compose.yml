services:
  caddy:
    image: caddy:2-alpine
    container_name: agus-crypto-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - crypto-internal
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  api:
    build:
      context: ../../../
      dockerfile: deploy/crypto/Dockerfile
    image: agus-crypto-app:devnet
    container_name: agus-crypto-api
    restart: unless-stopped
    command: ["sh", "deploy/crypto/start.sh", "api"]
    env_file:
      - ${ENV_FILE:-/etc/agus/crypto.env}
    expose:
      - "3000"
    networks:
      - crypto-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    image: agus-crypto-app:devnet
    container_name: agus-crypto-worker
    restart: unless-stopped
    command: ["sh", "deploy/crypto/start.sh", "worker"]
    env_file:
      - ${ENV_FILE:-/etc/agus/crypto.env}
    networks:
      - crypto-internal
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  crypto-internal:
    driver: bridge
    name: agus-crypto-internal

volumes:
  caddy_data:
    name: agus-crypto-caddy-data
  caddy_config:
    name: agus-crypto-caddy-config
